version: "2"

run:
  build-tags:
    - openbao

linters:
  default: standard
  enable:
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    rules:
      # tests are not attack surface
      - path: _test\.go$
        linters:
          - gosec
      # contract suite methods must be exported for testify to find them,
      # the test name is the documentation
      - path: ^backendtest/
        linters:
          - revive
        text: exported method \w*Suite\.Test
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # G704 flags every request to a variable address. The only
        # address a backend reaches is the one its consumer configured,
        # never one from a caller's input.
        - G704
    nolintlint:
      require-explanation: true
    staticcheck:
      checks:
        - all
        # S1016 prefers struct conversions over explicit literals. House
        # style is the explicit literal.
        - -S1016

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/The127/signr
