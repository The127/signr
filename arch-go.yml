# Package dependency rules, checked by `just arch`. Patterns are regular
# expressions after arch-go's rewriting, so a single package is anchored
# with $ and `x.**` covers x and everything below it.
version: 1
threshold:
  compliance: 100
  coverage: 100
dependenciesRules:
  # the root package is the vocabulary, it never sees a backend
  - package: '**.signr$'
    shouldNotDependsOn:
      internal:
        - '**.signr.backends.**'
        - '**.signr.internal.**'
        - '**.signr.jwtmethod$'
        - '**.signr.example$'
  # key primitives depend on nothing of ours
  - package: '**.signr.internal.keyinfra$'
    shouldNotDependsOn:
      internal:
        - '**.signr.**'
  # jwt glue adapts a signing key, it never picks a backend
  - package: '**.signr.jwtmethod$'
    shouldOnlyDependsOn:
      internal:
        - '**.signr$'
  # backends know the vocabulary and the primitives, not each other
  - package: '**.signr.backends.*'
    shouldOnlyDependsOn:
      internal:
        - '**.signr$'
        - '**.signr.internal.keyinfra$'
  # the contract suite speaks the vocabulary only, never a backend
  - package: '**.signr.backendtest$'
    shouldOnlyDependsOn:
      internal:
        - '**.signr$'
  # the example wires everything, like a consumer would
  - package: '**.signr.example$'
    shouldNotDependsOn:
      internal:
        - '**.signr.internal.**'
