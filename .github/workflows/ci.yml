name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: prose check
        run: |
          emdash=$(printf '\342\200\224')
          if git grep -n "$emdash" -- ':!LICENSE'; then
            echo "em-dashes found, replace them (see CLAUDE.md prose rules)"
            exit 1
          fi

      - name: doc comment check
        run: bash scripts/check-doc-comments.sh

      - name: architecture check
        run: go run github.com/arch-go/arch-go@v1.7.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: build and test
        run: |
          go build ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: openbao backend contract
        run: |
          docker run -d --name signr-openbao-test -p 127.0.0.1:18200:8200 docker.io/openbao/openbao:2.6.2 server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 -o /dev/null http://127.0.0.1:18200/v1/sys/health
          SIGNR_OPENBAO_ADDR=http://127.0.0.1:18200 SIGNR_OPENBAO_TOKEN=root go test -tags openbao -count=1 ./backends/openbao/...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unit
