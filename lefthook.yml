pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: just lint
    - name: prose check
      run: just prose
    - name: doc comment check
      run: just doccheck
    - name: architecture check
      glob:
        - "**/*.go"
        - "arch-go.yml"
      run: just arch

commit-msg:
  jobs:
    - name: conventional commit message
      run: |
        head -n1 {1} | grep -qE '^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert)!?: .+' || {
          echo "commit message must follow plain conventional commits: 'type: description' (no scopes)"
          exit 1
        }
    - name: dco sign-off
      run: |
        grep -qE '^Signed-off-by: .+ <.+@.+>' {1} || {
          echo "commit must be signed off (git commit -s), see CONTRIBUTING.md"
          exit 1
        }
